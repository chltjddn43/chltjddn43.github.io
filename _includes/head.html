<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>
    {% if page.title %}{{ page.title | escape }} - {{ site.title | escape }}
    {% else %}{{ site.title | escape }}{% endif %}
  </title>

  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap' rel='stylesheet'>

  <script src="https://use.fontawesome.com/releases/v5.15.3/js/all.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="{{"/assets/main.css" | relative_url }}">
  <style>
    /* ── DARK MODERN THEME ─────────────────────────────── */
    html, body {
      background-color: #0a0e1a !important;
      color: #e2e8f0 !important;
      font-family: 'Inter', sans-serif !important;
    }
    h1,h2,h3,h4,h5,h6 {
      font-family: 'Space Grotesk', sans-serif !important;
      color: #f1f5f9 !important;
    }
    a { color: #4e9eff !important; transition: color .2s; }
    a:hover { color: #7bb8ff !important; text-decoration: none; }
    p { color: #e2e8f0; line-height: 1.75; }
    hr { border-color: #1e2d45 !important; margin: 0; }

    /* NAVBAR */
    #mainNav {
      position: fixed !important;
      top: 0 !important;
      background: rgba(10,14,26,0.88) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border-bottom: 1px solid #1e2d45 !important;
      box-shadow: 0 1px 24px rgba(0,0,0,0.5) !important;
    }
    #mainNav .navbar-brand {
      font-family: 'Space Grotesk', sans-serif !important;
      font-weight: 700 !important;
      color: #f1f5f9 !important;
      font-size: 1rem !important;
    }
    #mainNav .nav-link {
      color: #94a3b8 !important;
      font-size: 11px !important;
      letter-spacing: 1.8px !important;
      font-weight: 600 !important;
    }
    #mainNav .nav-link:hover,
    #mainNav .navbar-brand:hover { color: #4e9eff !important; }

    /* HERO */
    header.masthead { margin-bottom: 0 !important; }
    header.masthead .overlay {
      background: linear-gradient(160deg,rgba(8,12,28,0.9) 0%,rgba(15,25,55,0.78) 100%) !important;
      opacity: 1 !important;
    }
    header.masthead .page-heading,
    header.masthead .site-heading { padding: 160px 0 110px !important; }
    header.masthead h1 {
      font-family: 'Space Grotesk', sans-serif !important;
      font-size: 2.8rem !important;
      color: #f1f5f9 !important;
      text-shadow: 0 0 40px rgba(78,158,255,0.35) !important;
    }
    header.masthead .subheading {
      font-family: 'Inter', sans-serif !important;
      color: #94a3b8 !important;
      font-size: 1rem !important;
      font-weight: 400 !important;
    }

    /* CONTENT CARD */
    .container > .row > [class*="col-"] {
      background: #111827 !important;
      border: 1px solid #1e2d45 !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4) !important;
      padding: 2.5rem 3rem !important;
      margin-top: 2.5rem !important;
      margin-bottom: 2.5rem !important;
      color: #e2e8f0 !important;
    }

    /* BUTTONS */
    .btn-primary {
      background: #4e9eff !important;
      border: none !important;
      color: #0a0e1a !important;
      font-weight: 700 !important;
      border-radius: 6px !important;
      box-shadow: 0 0 16px rgba(78,158,255,0.3) !important;
    }
    .btn-primary:hover {
      background: #7bb8ff !important;
      box-shadow: 0 0 24px rgba(78,158,255,0.5) !important;
    }
    .btn-pdf {
      background: #4e9eff !important;
      color: #0a0e1a !important;
      font-weight: 700 !important;
      border-radius: 6px !important;
      box-shadow: 0 0 10px rgba(78,158,255,0.2) !important;
    }
    .btn-pdf:hover {
      background: #7bb8ff !important;
      box-shadow: 0 0 18px rgba(78,158,255,0.4) !important;
      color: #0a0e1a !important;
    }
    .btn-pptx {
      border: 1px solid #1e2d45 !important;
      color: #64748b !important;
      background: transparent !important;
      border-radius: 6px !important;
    }
    .btn-pptx:hover {
      border-color: #4e9eff !important;
      color: #4e9eff !important;
    }

    /* HOME CARDS */
    .port-card {
      background: #1a2235 !important;
      border: 1px solid #1e2d45 !important;
      border-radius: 10px !important;
      transition: border-color .25s, box-shadow .25s, transform .2s !important;
    }
    .port-card h3 { color: #f1f5f9 !important; font-family: 'Space Grotesk', sans-serif !important; }
    .port-card p  { color: #64748b !important; margin: 0 !important; font-size: 0.87rem; }
    .port-card:hover {
      border-color: #4e9eff !important;
      box-shadow: 0 0 24px rgba(78,158,255,0.18) !important;
      transform: translateY(-3px) !important;
      color: #e2e8f0 !important;
    }
    .home-section h2 { color: #f1f5f9 !important; }
    .home-section p  { color: #e2e8f0 !important; }

    /* SEMINAR / TABLE */
    .file-table th {
      color: #475569 !important;
      border-bottom: 2px solid #1e2d45 !important;
      font-family: 'Space Grotesk', sans-serif !important;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .file-table td { color: #e2e8f0 !important; border-bottom: 1px solid #1e2d45 !important; }
    .file-table tr:hover td { background: rgba(78,158,255,0.05) !important; }
    .file-table a { color: #e2e8f0 !important; font-weight: 500; }
    .file-table a:hover { color: #4e9eff !important; }
    .group-heading {
      font-family: 'Space Grotesk', sans-serif !important;
      font-size: 0.8rem !important;
      letter-spacing: 0.1em !important;
      text-transform: uppercase !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4) !important;
    }

    /* REVIEW CARDS */
    .paper-card {
      background: #1a2235 !important;
      border: 1px solid #1e2d45 !important;
      border-radius: 10px !important;
    }
    .paper-card:hover { border-color: #4e9eff !important; box-shadow: 0 0 20px rgba(78,158,255,0.15) !important; }
    .paper-header { background: transparent !important; }
    .paper-title  { color: #f1f5f9 !important; font-family: 'Inter', sans-serif !important; }
    .paper-num    { color: #334155 !important; }
    .paper-venue  { color: #64748b !important; }
    .notes-body   { background: rgba(0,0,0,0.25) !important; border-top: 1px solid #1e2d45 !important; }
    .notes-body p { color: #e2e8f0 !important; }
    .notes-empty  { color: #334155 !important; }
    .btn-notes {
      border: 1px solid #1e2d45 !important;
      color: #475569 !important;
      background: transparent !important;
      border-radius: 6px !important;
    }
    .btn-notes:hover { border-color: #4e9eff !important; color: #4e9eff !important; }

    /* ABOUT */
    .cv-section h3 {
      color: #4e9eff !important;
      border-bottom: 1px solid #1e2d45 !important;
      font-family: 'Space Grotesk', sans-serif !important;
      font-size: 0.76rem !important;
      letter-spacing: 0.12em !important;
      padding-bottom: 0.4rem !important;
    }
    .cv-body .role { color: #f1f5f9 !important; }
    .cv-body .sub  { color: #94a3b8 !important; }
    .cv-body .desc { color: #64748b !important; }
    .cv-date       { color: #64748b !important; }
    .tag {
      background: rgba(78,158,255,0.1) !important;
      border: 1px solid rgba(78,158,255,0.3) !important;
      color: #4e9eff !important;
    }
    .contact-links a { color: #4e9eff !important; }

    /* FOOTER */
    footer {
      background: #111827 !important;
      border-top: 1px solid #1e2d45 !important;
    }
    footer .copyright { color: #475569 !important; }
    footer .fas.fa-circle { color: #1a2235 !important; }
  </style>
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

</head>
